steps:
  - id: 'restore cache'
    name: gcr.io/${PROJECT_ID}/restore_cache
    args:
      [
        '--bucket=gs://${_CACHE_BUCKET}',
        '--key=node_modules-$( checksum pnpm-lock.yaml )',
        '--key_fallback=node_modules-',
      ]

  - id: 'restore pnpm store cache'
    name: gcr.io/${PROJECT_ID}/restore_cache
    args:
      [
        '--bucket=gs://${_CACHE_BUCKET}',
        '--key=pnpm-store-v1',
      ]

  - id: 'pnpm install'
    name: node:${_NODE_VERSION}-alpine
    script: |
      #!/usr/bin/env ash
      corepack enable
      pnpm config set store-dir /workspace/.pnpm-store
      pnpm install --frozen-lockfile

  - id: 'scan with trivy'
    name: 'aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c'
    args:
      - 'fs'
      - '--db-repository'
      - 'us-docker.pkg.dev/gr4vy-admin/aquasecurity/trivy-db'
      - '.'
    env:
      - 'TRIVY_EXIT_CODE=0'
      - 'TRIVY_NO_PROGRESS=true'
      - 'TRIVY_IGNORE_UNFIXED=true'

  - id: 'pnpm build'
    name: node:${_NODE_VERSION}-alpine
    script: |
      #!/usr/bin/env ash
      corepack enable
      pnpm run build

  - id: 'push to storage bucket'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    entrypoint: gsutil
    args:
      [
        '-m',
        'cp',
        '-r',
        '-Z',
        './packages/embed-cdn/lib/gr4vy-embed.js',
        'gs://$_ARTIFACT_STORAGE_BUCKET/$COMMIT_SHA/embed.latest.js',
      ]

  - id: 'remove cache-control metadata'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    entrypoint: gsutil
    args:
      [
        '-m',
        'setmeta',
        '-h',
        'Cache-Control',
        'gs://$_ARTIFACT_STORAGE_BUCKET/$COMMIT_SHA/**',
      ]

  - id: 'Set cache-control on assets'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    entrypoint: gsutil
    args:
      [
        '-m',
        'setmeta',
        '-h',
        'Cache-Control: public, max-age=31536000',
        'gs://$_ARTIFACT_STORAGE_BUCKET/$COMMIT_SHA/**/*.js',
      ]

  - id: 'save cache'
    waitFor: ['pnpm build']
    name: gcr.io/${PROJECT_ID}/save_cache
    args:
      [
        '--bucket=gs://${_CACHE_BUCKET}',
        '--key=node_modules-$( checksum pnpm-lock.yaml )',
        '--path=node_modules',
        '--no-clobber',
      ]

  - id: 'save pnpm store cache'
    waitFor: ['pnpm install']
    name: gcr.io/${PROJECT_ID}/save_cache
    args:
      [
        '--bucket=gs://${_CACHE_BUCKET}',
        '--key=pnpm-store-v1',
        '--path=/workspace/.pnpm-store',
        '--no-clobber',
      ]

  - id: verify github checks completed successfully
    name: 'gcr.io/${PROJECT_ID}/github-checks:1.0'
    script: |
      #!/usr/bin/env bash
      export GITHUB_TOKEN=${GITHUB_TOKEN_CHECKS}
      github_checks \
        --repo="${REPO_NAME}" \
        --ref="${COMMIT_SHA}" \
        --ignore="${TRIGGER_NAME} (${PROJECT_ID})"
    secretEnv:
      - GITHUB_TOKEN_CHECKS

  - id: "deploy to sandbox environments"
    name: "gcr.io/cloud-builders/docker"
    secretEnv:
      - GITHUB_TOKEN_DEPLOY
    script: |
      #!/usr/bin/env bash
      export GITHUB_TOKEN=${GITHUB_TOKEN_DEPLOY}

      if [ "${BRANCH_NAME}" = "main" ]; then
        fail=0
        for instance in ${_GR4VY_INSTANCES}; do
          echo "Triggering deploy of main branch to ${instance}-sandbox..."
          docker run --rm -e GITHUB_TOKEN --network=cloudbuild gcr.io/${PROJECT_ID}/deployer:latest deploy --id ${instance} --sandbox --repo ${REPO_NAME} --ref ${COMMIT_SHA} --skip-checks
          if [ $? -ne 0 ]; then
            fail=1
          fi
        done
        if [ $fail -eq 1 ]; then
          exit 1
        fi
      else
        echo "This is the ${BRANCH_NAME} branch. Not deploying to sandbox environments."
      fi;

  - id: "deploy to production environments"
    name: "gcr.io/cloud-builders/docker"
    secretEnv:
      - GITHUB_TOKEN_DEPLOY
    script: |
      #!/usr/bin/env bash
      export GITHUB_TOKEN=${GITHUB_TOKEN_DEPLOY}

      if [ "${BRANCH_NAME}" = "main" ]; then
        fail=0
        for instance in ${_GR4VY_INSTANCES}; do
          echo "Triggering deploy of main branch to ${instance}-production..."
          docker run --rm -e GITHUB_TOKEN --network=cloudbuild gcr.io/${PROJECT_ID}/deployer:latest deploy --id ${instance} --production --repo ${REPO_NAME} --ref ${COMMIT_SHA} --skip-checks
          if [ $? -ne 0 ]; then
            fail=1
          fi
        done
        if [ $fail -eq 1 ]; then
          exit 1
        fi
      else
        echo "This is the ${BRANCH_NAME} branch. Not deploying to production environments."
      fi;

substitutions:
  _NODE_VERSION: '22.23.4'
  _ARTIFACT_STORAGE_BUCKET: ''
  _CACHE_BUCKET: ''
  _GITHUB_TOKEN_LOCATION: ''
  _GR4VY_INSTANCES: ''

availableSecrets:
  secretManager:
    - versionName: "projects/500372214742/secrets/gr4vy-code-read-only-github-token-classic-repo/versions/latest"
      env: 'GITHUB_TOKEN_CHECKS'
    - versionName: "projects/500372214742/secrets/gr4vy-code-github-token-deployments/versions/latest"
      env: 'GITHUB_TOKEN_DEPLOY'

tags:
  - 'gr4vy-build'

options:
  automapSubstitutions: true
  dynamic_substitutions: true
  substitution_option: 'ALLOW_LOOSE'
  machineType: 'E2_MEDIUM'
  logging: 'LEGACY'

logsBucket: 'gs://cloud-build-log-storage'

timeout: 1800s
